<!-- This is how you add comments in html -->

<!DOCTYPE html>   <!-- This defines that this document is an HTML5 document -->
<html lang="en">    <!-- This is the root element of an HTML page -->
<head>   <!-- This element contains meta information about the HTML page -->
<title>Page Title</title> <!-- This element specifies a title for the HTML page (which 
is shown in the browser's title bar or in the page's tab) -->
<link rel="stylesheet" href="mystyle.css">
</head>    <!-- This closes the <HTML> tag -->

<body> <!-- element defines the document's body, and is a container for all the 
    visible contents, such as headings, paragraphs, images, hyperlinks, tables, lists, etc. -->

<h1>My First Heading</h1>     <!-- This element defines a large heading -->
<p>My first paragraph.</p>     <!-- This element defines a paragraph-->
<a href="thml2.html">html2</a>
</body>    <!-- This closes the body-->
</html>    <!-- This closes the whole html-->
